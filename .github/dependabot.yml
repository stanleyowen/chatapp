version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    groups:
      client-deps: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    groups:
      server-deps: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
